# 暴露 MinecraftServer 的私有字段，用于运行时动态构造 ServerLevel
# ServerLevel 的构造需要以下三个字段（原版无公开 getter）
public net.minecraft.server.MinecraftServer executor
public net.minecraft.server.MinecraftServer storageSource
public net.minecraft.server.MinecraftServer progressListenerFactory

# 去掉 final 并公开时间相关字段，用于世界重载后接管个人维度：
# vanilla createLevels() 会用 DerivedLevelData + tickTime=false 重建非主世界维度，
# 需在服务器启动后把这些字段替换为 PersonalDimensionLevelData 并开启独立走时。
public-f net.minecraft.world.level.Level levelData
public-f net.minecraft.server.level.ServerLevel serverLevelData
public-f net.minecraft.server.level.ServerLevel tickTime

# 公开 MappedRegistry 的索引结构，用于删除个人维度时从 LEVEL_STEM 注册表移除对应 stem。
# 存档时 WorldGenSettings.encode 会把 LEVEL_STEM 注册表中的全部维度写入 level.dat，
# 若不移除 stem，被删维度会在重启后复现。移除需同时从下列全部索引中删除该条目，
# 并重建 byId/toId（byId 下标即数值 id，删除会使其后条目错位）。仅读取字段并修改其
# 指向的集合内容，故无需去 final。
public net.minecraft.core.MappedRegistry byId
public net.minecraft.core.MappedRegistry toId
public net.minecraft.core.MappedRegistry byLocation
public net.minecraft.core.MappedRegistry byKey
public net.minecraft.core.MappedRegistry byValue
public net.minecraft.core.MappedRegistry registrationInfos

# 公开 ServerLevel.findLightningTargetAround，供维度闪电接口方块复用原版"避雷针优先 + 3×3×h 生物吸引"
# 落点查找逻辑。该方法原为 protected，手写复刻避雷针 POI 查询成本高且与原版易脱节，故直接 AT 暴露。
public net.minecraft.server.level.ServerLevel findLightningTargetAround(Lnet/minecraft/core/BlockPos;)Lnet/minecraft/core/BlockPos;
