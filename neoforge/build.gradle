plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

configurations.all {
    resolutionStrategy {
        force "io.github.llamalad7:mixinextras-neoforge:$rootProject.mixinextras_version"
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation("dev.architectury:architectury-neoforge:$rootProject.architectury_api_version") {
    exclude group: 'io.github.llamalad7', module: 'mixinextras-neoforge'
}

    modImplementation "io.github.llamalad7:mixinextras-neoforge:$rootProject.mixinextras_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Codec classes are available at compile time and shaded into the final mod.\n    // Do not put these dependencies on the NeoForge runtime module path: that\n    // duplicates packages already present in the shaded personaldimension JAR.\n    // MP3 decoder bundled into Personal Shelter; players do not install OpenFM.
    compileOnly "javazoom:jlayer:1.0.1"
    shadowBundle "javazoom:jlayer:1.0.1"

    // AAC ADTS decoder bundled directly; no OpenFM installation required.
    compileOnly "de.sfuhrm:jaad:0.8.7"
    shadowBundle "de.sfuhrm:jaad:0.8.7"

    // Ogg Vorbis Java Sound SPI, bundled with the client mod.
    compileOnly "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
    shadowBundle "com.googlecode.soundlibs:vorbisspi:1.0.3.3"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

sourceSets.main.resources.srcDir("src/generated/resources")
sourceSets.main.resources.srcDir(project(':common').sourceSets.main.resources.srcDirs)

shadowJar {
    configurations = [project.configurations.shadowBundle]
    // Preserve Java Sound SPI registrations from bundled codec dependencies.
    relocate 'com.jcraft.jorbis', 'com.ruadou.personaldimension.shaded.jorbis'
    relocate 'com.jcraft.jogg', 'com.ruadou.personaldimension.shaded.jogg'
    mergeServiceFiles()
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}