name: Build NeoForge 1.21.1 (Java 21)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  neoforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - name: Build NeoForge only
        run: gradle :neoforge:build --stacktrace --no-daemon
      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: personal-shelter-neoforge-1.21.1
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
