name: Personal Shelter NeoForge build
on:
  # Keep the legacy build available manually; never launch a second
  # hosted runner for each commit while private Actions billing is blocked.
  workflow_dispatch:
jobs:
  neoforge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - name: Verify project source exists
        shell: bash
        run: |
          test -f settings.gradle
          test -d common/src/main
          test -d neoforge/src/main
      - name: Compile NeoForge mod
        run: gradle :neoforge:build --stacktrace --no-daemon
      - name: Verify radio audio signatures (Java 21)
        shell: bash
        run: |
          mkdir -p build/radio-probe-tests
          javac -encoding UTF-8 -d build/radio-probe-tests \
            neoforge/src/main/java/com/ruadou/personaldimension/neoforge/client/RadioAudioProbe.java \
            neoforge/src/test/java/com/ruadou/personaldimension/neoforge/client/RadioAudioProbeSelfTest.java \
            neoforge/src/main/java/com/ruadou/personaldimension/neoforge/client/RadioPcm.java \
            neoforge/src/test/java/com/ruadou/personaldimension/neoforge/client/RadioPcmSelfTest.java
          java -cp build/radio-probe-tests com.ruadou.personaldimension.neoforge.client.RadioAudioProbeSelfTest
          java -cp build/radio-probe-tests com.ruadou.personaldimension.neoforge.client.RadioPcmSelfTest
      - name: Upload NeoForge JARs
        uses: actions/upload-artifact@v4
        with:
          name: personal-shelter-neoforge-build
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
