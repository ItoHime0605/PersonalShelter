name: Personal Shelter NeoForge build
on:
  workflow_dispatch:
  push:
    paths:
      - 'common/**'
      - 'neoforge/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/personal-shelter-neoforge.yml'
jobs:
  neoforge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - name: Verify project source exists
        shell: bash
        run: |
          test -f settings.gradle
          test -d common/src/main
          test -d neoforge/src/main
      - name: Compile NeoForge mod
        run: gradle :neoforge:build --stacktrace --no-daemon
      - name: Upload NeoForge JARs
        uses: actions/upload-artifact@v4
        with:
          name: personal-shelter-neoforge-build
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
